name: test1

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Print each character of TS_ADD_ARGS
        run: |
          # Ensure the variable is set (optional safety check)
          if [ -z "${TS_ADD_ARGS}" ]; then
            echo "⚠️ TS_ADD_ARGS is empty or unset"
            exit 0
          fi

          # Iterate over each character and print it on a new line
          for (( i=0; i<${#TS_ADD_ARGS}; i++ )); do
            char="${TS_ADD_ARGS:$i:1}"
            echo "char[$i]: '$char'"
          done
        env:
          TS_ADD_ARGS: ${{ secrets.TS_ADD_ARGS }}
