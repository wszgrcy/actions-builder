name: Build Strix

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */3 * * *'   # 每3小时运行一次（UTC 整点）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: 'halo-box/strix-llama.cpp'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake make glslc libvulkan-dev spirv-headers
      - name: Compute version from commit count
        id: version
        run: echo "version=v0.0.$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Install Vulkan dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libvulkan-dev

      - name: Configure Vulkan build
        run: cmake -B build -DGGML_VULKAN=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j $(nproc)

      - name: Package binaries
        run: tar -czf strix-llama.cpp-${{ steps.version.outputs.version }}.tar.gz -C build/bin .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: strix-llama.cpp-${{ steps.version.outputs.version }}.tar.gz

  # 调用可重用工作流：必须是独立 job，不能写在 steps 里
  call-docker:
    needs: build-and-release
    uses: ./.github/workflows/docker.yml
    with:
      mVersion: ${{ needs.build-and-release.outputs.version }}
    secrets: inherit  